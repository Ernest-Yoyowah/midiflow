[package]
name = "midiflow"
version = "0.1.0"
description = "MIDIFlow — AI Workflow Assistant for Keyboardists"
authors = []
edition = "2021"

[lib]
name = "midiflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
